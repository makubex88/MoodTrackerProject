server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API lives on the same origin as far as the browser is concerned. Matching trailing slashes
    # on location and proxy_pass mean /api/moods reaches the backend as /api/moods.
    location ^~ /api/ {
        proxy_pass http://web:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Angular routing: a refresh on /admin must serve index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html is not.
    location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
